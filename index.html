<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>학산급식리뷰</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 상단 -->
    <header>
        <div class="header-content">

            <!-- 귀여운 토끼 -->
            <div class="chef-rabbit">
                <svg viewBox="0 0 180 190" xmlns="http://www.w3.org/2000/svg">

                    <!-- 귀 -->
                    <ellipse cx="65" cy="43" rx="25" ry="48"
                             fill="#fff8fc" stroke="#d9c9df" stroke-width="3"/>
                    <ellipse cx="115" cy="43" rx="25" ry="48"
                             fill="#fff8fc" stroke="#d9c9df" stroke-width="3"/>

                    <!-- 귀 안쪽 -->
                    <ellipse cx="65" cy="43" rx="12" ry="34"
                             fill="#f5c5da"/>
                    <ellipse cx="115" cy="43" rx="12" ry="34"
                             fill="#f5c5da"/>

                    <!-- 얼굴 -->
                    <ellipse cx="90" cy="105" rx="67" ry="61"
                             fill="#fffdfd" stroke="#d9c9df" stroke-width="3"/>

                    <!-- 반짝이는 왼쪽 눈 -->
                    <ellipse cx="64" cy="101" rx="14" ry="17" fill="#59416f"/>
                    <circle cx="59" cy="95" r="5" fill="white"/>
                    <circle cx="68" cy="108" r="2.5" fill="#e9c9f4"/>

                    <!-- 반짝이는 오른쪽 눈 -->
                    <ellipse cx="116" cy="101" rx="14" ry="17" fill="#59416f"/>
                    <circle cx="111" cy="95" r="5" fill="white"/>
                    <circle cx="120" cy="108" r="2.5" fill="#e9c9f4"/>

                    <!-- 볼 -->
                    <ellipse cx="42" cy="122" rx="13" ry="7"
                             fill="#f7cddd" opacity="0.7"/>
                    <ellipse cx="138" cy="122" rx="13" ry="7"
                             fill="#f7cddd" opacity="0.7"/>

                    <!-- 코 -->
                    <path d="M90 116 C84 111 79 116 90 124 C101 116 96 111 90 116Z"
                          fill="#e9a9c5"/>

                    <!-- 입 -->
                    <path d="M90 124 C86 131 80 132 77 128"
                          fill="none" stroke="#59416f" stroke-width="3"
                          stroke-linecap="round"/>
                    <path d="M90 124 C94 131 100 132 103 128"
                          fill="none" stroke="#59416f" stroke-width="3"
                          stroke-linecap="round"/>

                    <!-- 수염 -->
                    <path d="M29 112 L8 107"
                          stroke="#c8b6d2" stroke-width="3"
                          stroke-linecap="round"/>
                    <path d="M29 121 L7 122"
                          stroke="#c8b6d2" stroke-width="3"
                          stroke-linecap="round"/>
                    <path d="M151 112 L172 107"
                          stroke="#c8b6d2" stroke-width="3"
                          stroke-linecap="round"/>
                    <path d="M151 121 L173 122"
                          stroke="#c8b6d2" stroke-width="3"
                          stroke-linecap="round"/>

                </svg>
            </div>

            <div>
                <h1>학산급식리뷰</h1>
                <p>오늘 뭐 나와? 🍚</p>
            </div>

        </div>
    </header>


    <main>

        <!-- 날짜 선택 -->
        <section class="date-section">

            <button id="prevDay">〈</button>

            <div>
                <span>📅</span>
                <input type="date" id="mealDate">
            </div>

            <button id="nextDay">〉</button>

            <button id="searchBtn">급식 보기</button>

        </section>


        <!-- 오늘의 급식 -->
        <section class="card meal-card">

            <div class="section-title">
                <span>🍱</span>
                <h2>오늘의 급식</h2>
            </div>

            <p id="mealDateText" class="date-text">
                오늘의 급식을 확인해보세요!
            </p>

            <div class="meal-content">

                <!-- 귀여운 토끼 -->
                <div class="meal-character">

                    <svg viewBox="0 0 180 190"
                         xmlns="http://www.w3.org/2000/svg">

                        <!-- 귀 -->
                        <ellipse cx="65" cy="43" rx="25" ry="48"
                                 fill="#fff8fc" stroke="#d9c9df" stroke-width="3"/>
                        <ellipse cx="115" cy="43" rx="25" ry="48"
                                 fill="#fff8fc" stroke="#d9c9df" stroke-width="3"/>

                        <ellipse cx="65" cy="43" rx="12" ry="34"
                                 fill="#f5c5da"/>
                        <ellipse cx="115" cy="43" rx="12" ry="34"
                                 fill="#f5c5da"/>

                        <!-- 얼굴 -->
                        <ellipse cx="90" cy="105" rx="67" ry="61"
                                 fill="#fffdfd" stroke="#d9c9df" stroke-width="3"/>

                        <!-- 초롱초롱한 눈 -->
                        <ellipse cx="64" cy="101" rx="14" ry="17" fill="#59416f"/>
                        <circle cx="59" cy="95" r="5" fill="white"/>
                        <circle cx="68" cy="108" r="2.5" fill="#e9c9f4"/>

                        <ellipse cx="116" cy="101" rx="14" ry="17" fill="#59416f"/>
                        <circle cx="111" cy="95" r="5" fill="white"/>
                        <circle cx="120" cy="108" r="2.5" fill="#e9c9f4"/>

                        <!-- 볼 -->
                        <ellipse cx="42" cy="122" rx="13" ry="7"
                                 fill="#f7cddd" opacity="0.7"/>
                        <ellipse cx="138" cy="122" rx="13" ry="7"
                                 fill="#f7cddd" opacity="0.7"/>

                        <!-- 코 -->
                        <path d="M90 116 C84 111 79 116 90 124
                                 C101 116 96 111 90 116Z"
                              fill="#e9a9c5"/>

                        <!-- 입 -->
                        <path d="M90 124 C86 131 80 132 77 128"
                              fill="none" stroke="#59416f" stroke-width="3"
                              stroke-linecap="round"/>
                        <path d="M90 124 C94 131 100 132 103 128"
                              fill="none" stroke="#59416f" stroke-width="3"
                              stroke-linecap="round"/>

                    </svg>

                    <span>맛있게 드세요! 💕</span>

                </div>

                <ul id="mealList">
                    <li>급식 정보를 불러오는 중이에요!</li>
                </ul>

            </div>

        </section>


        <!-- 만족도 -->
        <section class="card rating-card">

            <div class="section-title">
                <span>⭐</span>
                <h2>오늘의 만족도</h2>
            </div>

            <div class="rating-content">

                <!-- 귀여운 고양이 -->
                <div class="cat-character">

                    <svg viewBox="0 0 180 170"
                         xmlns="http://www.w3.org/2000/svg">

                        <!-- 귀 -->
                        <path d="M38 62 L43 18 L78 48 Z"
                              fill="#fff7fc"
                              stroke="#d9c9df"
                              stroke-width="4"/>

                        <path d="M142 62 L137 18 L102 48 Z"
                              fill="#fff7fc"
                              stroke="#d9c9df"
                              stroke-width="4"/>

                        <!-- 귀 안쪽 -->
                        <path d="M47 49 L49 31 L66 47 Z"
                              fill="#f4bfd8"/>
                        <path d="M133 49 L131 31 L114 47 Z"
                              fill="#f4bfd8"/>

                        <!-- 얼굴 -->
                        <ellipse cx="90" cy="94" rx="65" ry="56"
                                 fill="#fffdfd"
                                 stroke="#d9c9df"
                                 stroke-width="4"/>

                        <!-- 고양이 눈 -->
                        <ellipse cx="64" cy="90" rx="13" ry="16"
                                 fill="#59416f"/>
                        <circle cx="59" cy="84" r="5" fill="white"/>
                        <circle cx="68" cy="96" r="2" fill="#e9c9f4"/>

                        <ellipse cx="116" cy="90" rx="13" ry="16"
                                 fill="#59416f"/>
                        <circle cx="111" cy="84" r="5" fill="white"/>
                        <circle cx="120" cy="96" r="2" fill="#e9c9f4"/>

                        <!-- 볼 -->
                        <ellipse cx="42" cy="111" rx="12" ry="6"
                                 fill="#f7cddd" opacity="0.7"/>
                        <ellipse cx="138" cy="111" rx="12" ry="6"
                                 fill="#f7cddd" opacity="0.7"/>

                        <!-- 코 -->
                        <path d="M90 105 L84 101 L90 109 L96 101 Z"
                              fill="#e9a9c5"/>

                        <!-- 입 -->
                        <path d="M90 109 C86 115 82 115 79 112"
                              fill="none" stroke="#59416f"
                              stroke-width="3"
                              stroke-linecap="round"/>
                        <path d="M90 109 C94 115 98 115 101 112"
                              fill="none" stroke="#59416f"
                              stroke-width="3"
                              stroke-linecap="round"/>

                        <!-- 수염 -->
                        <path d="M29 101 L8 96"
                              stroke="#c8b6d2"
                              stroke-width="3"
                              stroke-linecap="round"/>
                        <path d="M29 111 L7 112"
                              stroke="#c8b6d2"
                              stroke-width="3"
                              stroke-linecap="round"/>

                        <path d="M151 101 L172 96"
                              stroke="#c8b6d2"
                              stroke-width="3"
                              stroke-linecap="round"/>
                        <path d="M151 111 L173 112"
                              stroke="#c8b6d2"
                              stroke-width="3"
                              stroke-linecap="round"/>

                    </svg>

                    <span>맛있었나요...?<br>별점 부탁해요! ✨</span>

                </div>

                <div class="rating-result">

                    <div id="averageRating">
                        0.0
                    </div>

                    <div id="averageStars" class="stars">
                        ☆☆☆☆☆
                    </div>

                    <p>
                        <span id="reviewCount">0</span>개의 리뷰
                    </p>

                </div>

            </div>

        </section>


        <!-- 리뷰 작성 -->
        <section class="card review-write">

            <div class="section-title">
                <span>✏️</span>
                <h2>리뷰 작성</h2>
            </div>

            <p class="guide">
                오늘 급식은 어땠나요?
            </p>

            <div class="rating-input">

                <button class="star-btn" data-rating="1">☆</button>
                <button class="star-btn" data-rating="2">☆</button>
                <button class="star-btn" data-rating="3">☆</button>
                <button class="star-btn" data-rating="4">☆</button>
                <button class="star-btn" data-rating="5">☆</button>

            </div>

            <textarea
                id="reviewText"
                placeholder="급식에 대한 솔직한 리뷰를 남겨주세요! 💕"
                maxlength="100"
            ></textarea>

            <button id="submitReview" class="submit-btn">
                리뷰 등록하기 💕
            </button>

        </section>


        <!-- 최근 리뷰 -->
        <section class="card">

            <div class="section-title">
                <span>💬</span>
                <h2>최근 리뷰</h2>
            </div>

            <div id="reviewList">

                <p class="empty-message">
                    아직 작성된 리뷰가 없어요 🥺
                </p>

            </div>

        </section>

    </main>


    <footer>
        <p>🍚 학산여자고등학교 급식 리뷰 프로젝트</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
